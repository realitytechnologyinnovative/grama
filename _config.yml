# Jekyll configuration for G-RAMA Turnstile Ltd
# GitHub Pages deployment: https://gramaturnstile.com

title: "G-RAMA Turnstile Ltd"
description: "Integrated Solutions Across Security, Technology, Agriculture, Infrastructure, and Procurement. Trusted by leading enterprises across Nigeria."
url: "https://gramaturnstile.com"
baseurl: ""
author: "G-RAMA Turnstile Ltd"
email: "info@gramaturnstile.com"
phone: "+234 814 546 5852"
address: "Flat B15, Block B, Wing B, Katampe Estate, FCT, Abuja"

timezone: Africa/Lagos
lang: en

# No theme — we use a fully custom HTML/CSS template
# theme: minima

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Ensure CNAME and other required files are copied to _site
include:
  - CNAME
  - site.webmanifest
  - favicon.ico
  - favicon.svg
  - favicon-96x96.png
  - apple-touch-icon.png

# Exclude development and source files from the build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - website-content.md
  - .gitignore
  - .github
  - img/grama.png

# SEO / Social
twitter:
  username: ""
  card: summary_large_image

facebook:
  publisher: ""

social:
  name: "G-RAMA Turnstile Ltd"
  links:
    - "https://gramaturnstile.com"

# Defaults for all pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
